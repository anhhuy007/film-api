version: "3.7"

networks:
  loki-gpl:
    driver: bridge

volumes:
  grafana-data:
  loki-data:

services:
  # 1. Loki Server (Log Aggregator)
  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100" # Mở cổng 3100 để NestJS (chạy ngoài docker) có thể kết nối
    command: -config.file=/etc/loki/loki-config.yml -config.expand-env=true
    volumes:
      - ./loki-config.yml:/etc/loki/loki-config.yml
      - loki-data:/loki
    networks:
      - loki-gpl

  # 2. Grafana (Visualization/Query UI)
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000" # Cổng truy cập Web UI
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - loki-gpl
    depends_on:
      - loki